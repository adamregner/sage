<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A calm daily stretching and yoga routine with breath guidance.">
  <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121812" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sage">
  <title>Sage · Daily Stretch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="today"><span class="tab-ic" data-icon="leaf"></span><span>Today</span></button>
      <button class="tab" data-tab="library"><span class="tab-ic" data-icon="grid"></span><span>Poses</span></button>
      <button class="tab" data-tab="progress"><span class="tab-ic" data-icon="calendar"></span><span>Progress</span></button>
    </nav>
  </div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="backdrop" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-body"></div>
    </div>
  </div>

  <section id="session" class="session" hidden aria-live="polite"></section>

  <script src="js/poses.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/routine.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
